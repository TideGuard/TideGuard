# Dispatch a TideGuard-Website rebuild when operator docs change.
# Requires repo secret DOCS_DISPATCH_TOKEN (PAT or fine-grained token with
# Actions: write on TideGuard/TideGuard-Website).
name: Docs site sync

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: docs-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Notify TideGuard-Website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository dispatch
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DOCS_DISPATCH_TOKEN is not set; skip website rebuild dispatch."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/TideGuard/TideGuard-Website/dispatches \
            -d '{"event_type":"docs-updated","client_payload":{"ref":"'"${{ github.sha }}"'"}}'
          echo "Dispatched docs-updated to TideGuard/TideGuard-Website"
